name: Vérifier les urgences graves
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
      timezone: Europe/London
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: french-daily-journal
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      pages_artifact: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: generator/requirements.lock
      - name: Install locked Python dependencies
        run: python -m pip install -r generator/requirements.lock
      - name: Restore the latest validated public state
        run: python -m generator.app.ci_state restore
      - name: Check recent serious events without any AI call
        # This job intentionally receives no Groq or Cloudflare secret.
        run: python -m generator.app.extras --alerts-only
      - name: Refresh the dated hadith from reviewed Arabic sources without AI
        run: python -m generator.app.hadith
      - name: Validate and retain publications
        run: |
          python -m generator.app.verify_site site
          python -m generator.app.ci_state save
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: site
  deploy:
    needs: produce
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish refreshed alerts alongside unchanged daily editions
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: ${{ needs.produce.outputs.pages_artifact }}
