name: Diagnostic Cloudflare AI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnostic-ai.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: One minimal request, report only numeric errors
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,re
          account=os.environ.get("CLOUDFLARE_ACCOUNT_ID","")
          token=os.environ.get("CLOUDFLARE_API_TOKEN","")
          if not re.fullmatch(r"[0-9a-fA-F]{32}",account) or not token:
              raise SystemExit("Missing or invalid secret configuration.")
          url="https://api.cloudflare.com/client/v4/accounts/"+account+"/ai/run/@cf/meta/llama-3.3-70b-instruct-fp8-fast"
          payload={"messages":[{"role":"user","content":"Réponds uniquement OK."}],"max_tokens":8}
          req=urllib.request.Request(url,data=json.dumps(payload).encode(),headers={"Authorization":"Bearer "+token,"Content-Type":"application/json"})
          try:
              with urllib.request.urlopen(req,timeout=30) as response:
                  body=json.load(response)
                  print("HTTP",response.status,"success",body.get("success"))
                  if body.get("success") is not True:
                      raise SystemExit("Provider did not confirm success")
          except urllib.error.HTTPError as error:
              print("HTTP",error.code)
              try:
                  body=json.loads(error.read(65536))
                  errors=body.get("errors",[])
                  for item in errors:
                      code=item.get("code")
                      if isinstance(code,int):
                          print("Cloudflare internal error:",code)
              except (ValueError,TypeError,AttributeError):
                  print("No structured error details")
              raise SystemExit(1)
          except (urllib.error.URLError,TimeoutError):
              raise SystemExit("Cloudflare network error")
          PY
