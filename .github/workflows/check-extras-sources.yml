name: Vérifier les sources historiques sans IA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/check-extras-sources.yml']
permissions:
  contents: read
jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: generator/requirements.lock
      - run: python -m pip install -r generator/requirements.lock
      - name: Read two calendar dates with the production loader, no model or publication
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta, timezone
          from generator.app.extras import LONDON, load_history_event
          today = datetime.now(timezone.utc).astimezone(LONDON).date()
          for day in (today, today + timedelta(days=1)):
              packet, sources = load_history_event(day)
              print('Calendar verified:', day, 'historical date:', packet['event_date'],
                    'sources:', len(sources), 'evidence words:',
                    sum(len(f['text'].split()) for f in packet['facts']))
          PY
