name: Compiler l'APK signé
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'generator/**', 'config/**', '.github/workflows/build-apk.yml']
  pull_request:
permissions:
  contents: read
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r generator/requirements.lock
          python -m pytest -q generator/tests
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run Android checks without publishing ephemeral signatures
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Recover signing key from encrypted repository secrets
        if: ${{ github.event_name != 'pull_request' }}
        env:
          LADJ_KEYSTORE_BASE64: ${{ secrets.LADJ_KEYSTORE_BASE64 }}
          LADJ_STORE_PASSWORD: ${{ secrets.LADJ_STORE_PASSWORD }}
          LADJ_KEY_ALIAS: ${{ secrets.LADJ_KEY_ALIAS }}
          LADJ_KEY_PASSWORD: ${{ secrets.LADJ_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${LADJ_KEYSTORE_BASE64:?Missing permanent signing key}"
          : "${LADJ_STORE_PASSWORD:?Missing store password}"
          : "${LADJ_KEY_ALIAS:?Missing key alias}"
          : "${LADJ_KEY_PASSWORD:?Missing key password}"
          path="$RUNNER_TEMP/l-actu-du-jour-signature.p12"
          printf '%s' "$LADJ_KEYSTORE_BASE64" | base64 --decode > "$path"
          chmod 600 "$path"
          keytool -list -keystore "$path" -storepass "$LADJ_STORE_PASSWORD" -alias "$LADJ_KEY_ALIAS" > /dev/null
          echo "LADJ_KEYSTORE_PATH=$path" >> "$GITHUB_ENV"
      - name: Build signed, installable release
        if: ${{ github.event_name != 'pull_request' }}
        working-directory: android
        env:
          LADJ_STORE_PASSWORD: ${{ secrets.LADJ_STORE_PASSWORD }}
          LADJ_KEY_ALIAS: ${{ secrets.LADJ_KEY_ALIAS }}
          LADJ_KEY_PASSWORD: ${{ secrets.LADJ_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk
          # Verify that the release is genuinely signed before making it downloadable.
          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          mkdir -p ../artifacts
          cp app/build/outputs/apk/release/app-release.apk ../artifacts/L-actu-du-jour.apk
          (cd ../artifacts && sha256sum L-actu-du-jour.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ github.event_name != 'pull_request' }}
        with:
          name: L-actu-du-jour-SIGNED
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Delete unencrypted key from runner
        if: ${{ always() && github.event_name != 'pull_request' }}
        run: rm -f "$RUNNER_TEMP/l-actu-du-jour-signature.p12"
