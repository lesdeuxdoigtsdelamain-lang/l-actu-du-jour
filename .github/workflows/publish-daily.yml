name: Publier le journal quotidien
on:
  # Run a first publication when the generation configuration is deployed or updated.
  push:
    branches: [main]
    paths: ['config/**', 'generator/**', '.github/workflows/publish-daily.yml']
  schedule:
    - cron: '5 17 * * *'
      timezone: Europe/London
    - cron: '20 18 * * *'
      timezone: Europe/London
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Regénérer l'édition du jour, sans doublon de date"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: french-daily-journal
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: generator/requirements.lock
      - name: Install locked Python dependencies
        run: python -m pip install -r generator/requirements.lock
      - name: Run generation and integrity tests
        run: python -m pytest -q generator/tests
      - name: Restore previous seven days of public content
        run: python -m generator.app.ci_state restore
      - name: Produce sourced, quality-gated French edition
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FORCE_REFRESH: ${{ inputs.force_refresh || false }}
        run: |
          if [ "$FORCE_REFRESH" = "true" ]; then
            python -m generator.app.main --force
          else
            python -m generator.app.main
          fi
      - name: Validate and retain publications (no API secrets)
        run: |
          python -m generator.app.verify_site site
          python -m generator.app.ci_state save
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
  deploy:
    needs: produce
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish JSON editions
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
