name: Publier le journal quotidien
on:
  # A marked commit completes the current day and refreshes the independent extras.
  push:
    branches: [main]
    paths: ['.github/workflows/publish-daily.yml']
  schedule:
    - cron: '5 17 * * *'
      timezone: Europe/London
    - cron: '20 18 * * *'
      timezone: Europe/London
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Recontrôler et compléter l'édition du jour"
        type: boolean
        default: false
      repair_dates:
        description: "Archives à corriger (YYYY-MM-DD,YYYY-MM-DD), sept derniers jours"
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: french-daily-journal
  # Both publication workflows share this lock through Pages deployment.
  # An urgent refresh must never cancel an edition or overwrite newer state.
  cancel-in-progress: false
jobs:
  produce:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[publish now]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      pages_artifact: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: generator/requirements.lock
      - name: Install locked Python dependencies
        run: python -m pip install -r generator/requirements.lock
      - name: Run generation and integrity tests
        run: python -m pytest -q generator/tests
      - name: Restore previous seven days of public content
        run: python -m generator.app.ci_state restore
      - name: Produce sourced, quality-gated French edition
        id: edition
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FORCE_REFRESH: ${{ inputs.force_refresh || github.event_name == 'push' }}
          REPAIR_DATES: ${{ inputs.repair_dates || (github.event_name == 'push' && contains(github.event.head_commit.message, '[repair editions]') && '2026-11-19,2026-11-20') || '' }}
        run: |
          if [ -n "$REPAIR_DATES" ]; then
            python -m generator.app.main --force --repair-dates "$REPAIR_DATES"
          elif [ "$FORCE_REFRESH" = "true" ]; then
            python -m generator.app.main --force
          else
            python -m generator.app.main
          fi
      - name: Update serious alerts and the short historical note
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -m generator.app.extras
      - name: Validate and retain publications (no API secrets)
        run: |
          python -m generator.app.verify_site site
          python -m generator.app.ci_state save
      - name: Report an incomplete generation without losing healthy publications
        if: steps.edition.outcome == 'failure'
        run: echo '::warning::Generation failed. Existing validated editions and independent extras are retained; consult health.json and generation logs.'
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: site
  deploy:
    needs: produce
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish JSON editions
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: ${{ needs.produce.outputs.pages_artifact }}
